# Staging stack, on the same host as production: app -> Postgres, no Caddy and no host ports.
# Production's Caddy reaches the app over the shared `sift-edge` network (created by
# compose.prod.yaml) as `sift-staging-app:3000` and serves it at STAGING_HOSTNAME.
# Usage on the server, from the staging checkout:  docker compose -f compose.staging.yaml up -d --build
#
# Every secret (DATABASE_URL, POSTGRES_*, GEMINI_API_KEY, WEBHOOK_SECRET, SESSION_SECRET,
# APP_BASE_URL, SEED_PASSWORD_*, GMAIL_USER, GMAIL_APP_PASSWORD) comes from the hand-made .env next to this file via env_file,
# so none is named here (see README "Staging"). The app and the seed fail on first use if one is missing.
name: sift-staging

x-app-env: &app-env
  NODE_ENV: production
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  AI_DAILY_CAP: ${AI_DAILY_CAP:-30}
  AI_RPM_LIMIT: ${AI_RPM_LIMIT:-4}
  AI_MANUAL_RESERVE_PCT: ${AI_MANUAL_RESERVE_PCT:-20}
  OVERDUE_HOURS: ${OVERDUE_HOURS:-24}
  # Staging never emails real customers: mail is captured to the dev mailbox. With
  # MAIL_TRANSPORT=gmail in .env it really sends, but only to MAIL_ALLOWED_RECIPIENTS.
  APP_ENV: ${APP_ENV:-staging}
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-capture}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sift Support (staging)}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    networks:
      default:
      edge:
        aliases: [sift-staging-app]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Background jobs (mail queue, triage, sweeps); same image, no network exposure.
  worker:
    build:
      context: .
      target: runner
    command: ["node", "worker.mjs"]
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  edge:
    name: sift-edge
    external: true

volumes:
  pgdata:
