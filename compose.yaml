# Local development stack: `docker compose up --build`
# Works without a .env file (dev defaults below); a .env next to this file overrides them.
# No fixed project name: each checkout/worktree gets its own containers and volume.
# Use APP_HOST_PORT / DB_HOST_PORT to avoid port clashes between parallel stacks.

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-sift}:${POSTGRES_PASSWORD:-sift}@db:5432/${POSTGRES_DB:-sift}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  AI_DAILY_CAP: ${AI_DAILY_CAP:-50}
  OVERDUE_HOURS: ${OVERDUE_HOURS:-24}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
  SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-at-least-32-chars}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  SEED_PASSWORD_ADMIN: ${SEED_PASSWORD_ADMIN:-admin-dev-password}
  SEED_PASSWORD_ALICE: ${SEED_PASSWORD_ALICE:-alice-dev-password}
  SEED_PASSWORD_BEN: ${SEED_PASSWORD_BEN:-ben-dev-password}
  SEED_PASSWORD_CHLOE: ${SEED_PASSWORD_CHLOE:-chloe-dev-password}
  SEED_PASSWORD_DEV: ${SEED_PASSWORD_DEV:-dev-dev-password}
  # capture: mail is stored and shown at /dev/mailbox instead of being delivered.
  MAIL_TRANSPORT: ${MAIL_TRANSPORT:-capture}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sift Support}
  APP_ENV: ${APP_ENV:-development}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sift}
      POSTGRES_DB: ${POSTGRES_DB:-sift}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migrator
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment: *app-env
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Background jobs (and later the IMAP reader). Same image as the app, single instance.
  worker:
    build:
      context: .
      target: runner
    command: ["node", "worker.mjs"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
