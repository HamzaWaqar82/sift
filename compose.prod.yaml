# Production stack (single EC2 host): Caddy (automatic HTTPS) -> app -> Postgres.
# Usage on the server:  docker compose -f compose.prod.yaml up -d --build
# Requires a hand-made .env next to this file (see .env.example). Missing secrets fail fast.
name: sift-prod

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
  GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  AI_DAILY_CAP: ${AI_DAILY_CAP:-50}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  SEED_PASSWORD_ADMIN: ${SEED_PASSWORD_ADMIN:?set SEED_PASSWORD_ADMIN}
  SEED_PASSWORD_ALICE: ${SEED_PASSWORD_ALICE:?set SEED_PASSWORD_ALICE}
  SEED_PASSWORD_BEN: ${SEED_PASSWORD_BEN:?set SEED_PASSWORD_BEN}
  SEED_PASSWORD_CHLOE: ${SEED_PASSWORD_CHLOE:?set SEED_PASSWORD_CHLOE}
  SEED_PASSWORD_DEV: ${SEED_PASSWORD_DEV:?set SEED_PASSWORD_DEV}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migrator
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # e.g. sift-203-0-113-10.sslip.io (resolves to 203.0.113.10)
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
      # Staging (compose.staging.yaml) is proxied by this Caddy too. Unset, it falls back to a
      # .localhost name, which Caddy serves with its internal CA and never asks Let's Encrypt for.
      STAGING_HOSTNAME: ${STAGING_HOSTNAME:-staging.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [default, edge]
    depends_on:
      - app

networks:
  # Shared with the staging project so this Caddy can reach its app; created here, external there.
  edge:
    name: sift-edge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
